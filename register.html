<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ثبت نام مربی</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="auth-page">


<div class="auth-card">

    <div class="logo">
        FIT PLAN
    </div>

    <h1>ثبت نام مربی</h1>

    <p class="auth-description">
        ساخت برنامه تمرینی حرفه‌ای
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        <label>نام مربی</label>

        <input
            type="text"
            name="name"
            required
            placeholder="نام و نام خانوادگی">


        <label>ایمیل</label>

        <input
            type="email"
            name="email"
            required
            placeholder="example@email.com">


        <label>رمز عبور</label>

        <input
            type="password"
            name="password"
            required
            placeholder="حداقل ۸ کاراکتر">


        <button class="main-button">
            ساخت حساب
        </button>

    </form>


    <p class="switch-auth">

        قبلاً ثبت نام کرده‌اید؟

        <a href="{{ url_for('login') }}">
            ورود
        </a>

    </p>

</div>


</body>

</html>
