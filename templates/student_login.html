<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود شاگرد | FIT PLAN</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    rgba(0, 255, 161, 0.10),
                    transparent 35%
                ),
                #080b12;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;

            background: rgba(17, 22, 32, 0.96);

            border: 1px solid rgba(0, 255, 161, 0.20);

            border-radius: 22px;

            padding: 30px 25px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.45);
        }

        .logo {
            text-align: center;

            color: #00ffa1;

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .title {
            text-align: center;

            font-size: 22px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #aab2c0;

            font-size: 14px;

            line-height: 1.8;

            margin-bottom: 22px;
        }

        .coach-box {
            background: rgba(0, 255, 161, 0.06);

            border: 1px solid rgba(0, 255, 161, 0.15);

            border-radius: 14px;

            padding: 14px;

            margin-bottom: 20px;

            text-align: center;
        }

        .coach-label {
            color: #8f98a8;

            font-size: 13px;

            margin-bottom: 5px;
        }

        .coach-name {
            color: #00ffa1;

            font-size: 18px;

            font-weight: bold;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border: 1px solid #303746;

            background: #0d121b;

            color: #ffffff;

            font-size: 16px;

            outline: none;

            direction: ltr;

            text-align: left;
        }

        input:focus {
            border-color: #00ffa1;
        }

        button {
            width: 100%;

            border: none;

            border-radius: 13px;

            padding: 14px;

            background: #00ffa1;

            color: #07110d;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 18px;
        }

        .error {
            background: rgba(255, 70, 70, 0.10);

            border: 1px solid rgba(255, 70, 70, 0.25);

            color: #ff8585;

            border-radius: 12px;

            padding: 12px;

            margin-bottom: 18px;

            font-size: 13px;

            text-align: center;

            line-height: 1.8;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #929aaa;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: #00ffa1;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            FIT PLAN
        </div>

        <div class="title">
            ورود شاگرد
        </div>

        <div class="subtitle">
            شماره موبایلی که هنگام ثبت‌نام وارد کردید را وارد کنید.
        </div>

        {% if coach %}
        <div class="coach-box">

            <div class="coach-label">
                مربی شما
            </div>

            <div class="coach-name">
                {{ coach["name"] }}
            </div>

        </div>
        {% endif %}

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <label for="phone">
                شماره موبایل
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="09123456789"
                maxlength="11"
                inputmode="numeric"
                required
            >

            <button type="submit">
                ورود به پنل
            </button>

        </form>

        <a
            class="back"
            href="{{ url_for('student_register', coach_code=coach['coach_code']) }}"
        >
            بازگشت
        </a>

    </div>

</body>

</html>
