```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود شاگرد | FIT PLAN</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .student-auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f6f8;
        }

        .student-auth-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,.10);
            border: 1px solid #e5e7eb;
        }

        .student-auth-logo {
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            color: #111827;
            margin-bottom: 20px;
        }

        .student-auth-title {
            text-align: center;
            margin: 0 0 7px;
            font-size: 22px;
        }

        .student-auth-subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            line-height: 1.9;
            margin: 0 0 22px;
        }

        .student-coach-box {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .student-coach-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .student-coach-name {
            color: #111827;
            font-size: 17px;
            font-weight: bold;
        }

        .student-auth-card label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
        }

        .student-auth-card input {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border: 1px solid #dfe3e8;
            border-radius: 8px;
            background: white;
            color: #17202a;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            direction: ltr;
            text-align: left;
        }

        .student-auth-card input:focus {
            border-color: #111827;
        }

        .student-login-submit {
            width: 100%;
            min-height: 44px;
            margin-top: 16px;
            border: none;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .student-login-submit:hover {
            background: #263449;
        }

        .student-auth-error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            text-align: center;
        }

        .student-auth-back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #777;
            text-decoration: none;
            font-size: 12px;
        }

        .student-auth-back:hover {
            color: #111827;
        }

        @media (max-width: 480px) {

            .student-auth-page {
                padding: 12px;
            }

            .student-auth-card {
                padding: 25px 18px;
                border-radius: 16px;
            }

            .student-auth-title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="student-auth-page">

    <div class="student-auth-card">

        <div class="student-auth-logo">
            FIT PLAN
        </div>

        <h1 class="student-auth-title">
            ورود شاگرد
        </h1>

        <p class="student-auth-subtitle">
            شماره موبایلی که هنگام ثبت‌نام وارد کردید را وارد کنید.
        </p>

        {% if coach %}
        <div class="student-coach-box">

            <div class="student-coach-label">
                مربی شما
            </div>

            <div class="student-coach-name">
                {{ coach["name"] }}
            </div>

        </div>
        {% endif %}

        {% if error %}
        <div class="student-auth-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <label for="phone">
                شماره موبایل
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="09123456789"
                maxlength="11"
                inputmode="numeric"
                autocomplete="tel"
                required
            >

            <button
                type="submit"
                class="student-login-submit"
            >
                ورود به پنل
            </button>

        </form>

        <a
            class="student-auth-back"
            href="{{ url_for('student_register', coach_code=coach['coach_code']) }}"
        >
            بازگشت به ثبت‌نام
        </a>

    </div>

</div>

</body>
</html>
```
