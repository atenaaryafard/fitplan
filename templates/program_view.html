<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>برنامه تمرینی | FIT PLAN</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

    <!--
        CSS مربوط به پلن مربی بعد از دریافت اطلاعات برنامه
        به صورت خودکار اینجا قرار می‌گیرد.
    -->
    <link
        id="programPlanStyle"
        rel="stylesheet">

    <!-- فقط برای ریسپانسیو صفحه آنلاین -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='program-responsive.css') }}">

</head>

<body>

<header class="mobile-header">

    <div class="brand">
        FIT PLAN
    </div>

</header>

<main class="planner">

    <section class="section-card">

        <div class="section-title">

            <div>
                <h2>برنامه تمرینی شما</h2>
            </div>

        </div>

        <div id="programBody">
            در حال بارگذاری برنامه...
        </div>

    </section>

    <div class="bottom-actions">

        <button
            id="downloadPdfBtn"
            type="button"
            class="pdf-button"
            style="display:none;"
            onclick="exportSharedPDF()">

            دریافت فایل PDF

        </button>

    </div>

</main>


<script>

    /*
       مقدار اولیه
       بعد از دریافت برنامه از API با اطلاعات واقعی مربی
       جایگزین می‌شود.
    */

    let COACH_BRAND = {

        hasCustomLogo: false,

        planKey: "basic",

        jobTitle: "",

        socialAddress: "",

        phoneNumber: "",

        footerText: "",

        coachName: ""

    };


    const SHARE_TOKEN = "{{ program.share_token }}";

</script>


<script src="{{ url_for('static', filename='logo-data.js') }}"></script>

<script src="{{ url_for('static', filename='exercises.js') }}"></script>

<script src="{{ url_for('static', filename='program-render.js') }}"></script>


<script>


    /* =====================================================
       انتخاب CSS بر اساس پلن مربی
    ===================================================== */

    function loadPlanStyle(planKey) {

        const styleElement =
            document.getElementById("programPlanStyle");

        const styleMap = {

            basic:
                "{{ url_for('static', filename='pdf_style_basic.css') }}",

            branded:
                "{{ url_for('static', filename='pdf_style_branded.css') }}",

            premium:
                "{{ url_for('static', filename='pdf_style_premium.css') }}"

        };

        const selectedStyle =
            styleMap[planKey] || styleMap.basic;

        styleElement.href = selectedStyle;

    }



    /* =====================================================
       دریافت برنامه
    ===================================================== */

    async function loadSharedProgram() {

        const body =
            document.getElementById("programBody");


        try {

            const response =
                await fetch(
                    `/api/program/shared/${SHARE_TOKEN}`
                );


            const result =
                await response.json();


            if (!response.ok || !result.success) {

                body.innerHTML =
                    "این برنامه پیدا نشد یا هنوز ارسال نشده است.";

                return;

            }


            const program =
                result.program;


            /* ---------------------------------------------
               پلن واقعی مربی
            --------------------------------------------- */

            const planKey =
                program.plan_key || "basic";


            /*
               CSS همان پلن را لود کن
            */

            loadPlanStyle(planKey);


            /* ---------------------------------------------
               اطلاعات برند مربی
            --------------------------------------------- */

            COACH_BRAND = {

                hasCustomLogo:
                    planKey !== "basic"
                    ? true
                    : Boolean(program.has_custom_logo),

                planKey:
                    planKey,

                jobTitle:
                    program.job_title || "",

                socialAddress:
                    program.social_address || "",

                phoneNumber:
                    program.phone_number || "",

                footerText:
                    program.footer_text || "",

                coachName:
                    program.coach_name || ""

            };


            /* ---------------------------------------------
               اطلاعات برنامه
            --------------------------------------------- */

            const previewData = {

                athlete_name:
                    program.athlete_name,

                athlete_age:
                    program.athlete_age,

                athlete_height:
                    program.athlete_height,

                athlete_weight:
                    program.athlete_weight,

                athlete_goal:
                    program.athlete_goal,

                athlete_gender:
                    program.athlete_gender,

                sizes:
                    program.sizes,

                notes:
                    program.notes,

                days:
                    program.program_data

            };


            /* ---------------------------------------------
               نمایش برنامه
               هدر + برنامه + فوتر
            --------------------------------------------- */

            body.innerHTML =
                buildBrandHeaderHTML()
                +
                buildProgramPreviewHTML(previewData)
                +
                buildBrandFooterHTML();


            /* ---------------------------------------------
               نمایش دکمه PDF
            --------------------------------------------- */

    //         document
    //             .getElementById("downloadPdfBtn")
    //             .style.display = "inline-block";


    //         /*
    //            برای exportSharedPDF
    //         */

    //         window.__currentProgramBody =
    //             body;


    //     } catch (error) {

    //         console.error(error);

    //         body.innerHTML =
    //             "خطا در دریافت برنامه.";

    //     }

    // }



    /* =====================================================
       ساخت PDF
    ===================================================== */

    async function exportSharedPDF() {

        const body =
            window.__currentProgramBody
            ||
            document.getElementById("programBody");


        /*
           برای PDF همان ساختار فعلی حفظ می‌شود:
           هدر + برنامه + فوتر
        */

        const html =
            body.innerHTML;


        try {

            const response =
                await fetch(
                    `/api/program/pdf/shared/${SHARE_TOKEN}`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            html: html
                        })
                    }
                );


            if (!response.ok) {

                const error =
                    await response.json();

                throw new Error(
                    error.message ||
                    "خطا در ساخت PDF"
                );

            }


            const blob =
                await response.blob();


            const url =
                window.URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                "FIT_PLAN.pdf";


            document.body.appendChild(link);

            link.click();

            link.remove();


            window.URL.revokeObjectURL(url);


        } catch (error) {

            console.error(
                "PDF ERROR:",
                error
            );

            alert(
                "خطا در ساخت PDF: "
                +
                error.message
            );

        }

    }


    document.addEventListener(
        "DOMContentLoaded",
        loadSharedProgram
    );

</script>

</body>

</html>
