```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود به FIT PLAN</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .student-access-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f6f8;
        }

        .student-access-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,.10);
            border: 1px solid #e5e7eb;
        }

        .student-access-logo {
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            color: #111827;
            margin-bottom: 20px;
        }

        .student-access-title {
            text-align: center;
            margin: 0 0 7px;
            font-size: 22px;
            color: #17202a;
        }

        .student-access-subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            line-height: 1.9;
            margin: 0 0 24px;
        }

        .student-coach-box {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 24px;
            text-align: center;
        }

        .student-coach-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .student-coach-name {
            color: #111827;
            font-size: 17px;
            font-weight: bold;
        }

        .student-action-title {
            text-align: center;
            color: #555;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .student-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            transition: .2s ease;
        }

        .student-register-btn {
            background: #111827;
            color: white;
        }

        .student-register-btn:hover {
            background: #263449;
            transform: translateY(-1px);
        }

        .student-login-btn {
            background: #f1f5f9;
            color: #374151;
            border: 1px solid #e5e7eb;
        }

        .student-login-btn:hover {
            background: #e5e7eb;
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {

            .student-access-page {
                padding: 12px;
            }

            .student-access-card {
                padding: 25px 18px;
                border-radius: 16px;
            }

            .student-access-title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="student-access-page">

    <div class="student-access-card">

        <div class="student-access-logo">
            FIT PLAN
        </div>

        <h1 class="student-access-title">
            ورود به پنل شاگرد
        </h1>

        <p class="student-access-subtitle">
            برای استفاده از برنامه‌های تمرینی خود،
            ثبت‌نام کنید یا وارد حساب خود شوید.
        </p>

        {% if coach %}
        <div class="student-coach-box">

            <div class="student-coach-label">
                مربی شما
            </div>

            <div class="student-coach-name">
                {{ coach["name"] }}
            </div>

        </div>
        {% endif %}

        <div class="student-action-title">
            اگر قبلاً حساب نساخته‌اید، ابتدا ثبت‌نام کنید.
        </div>

        <a
            href="{{ url_for('student_register_form', coach_code=coach['coach_code']) }}"
            class="student-action-btn student-register-btn"
        >
            ثبت‌نام شاگرد
        </a>

        <a
            href="{{ url_for('student_login', coach_code=coach['coach_code']) }}"
            class="student-action-btn student-login-btn"
        >
            ورود به پنل
        </a>

    </div>

</div>

</body>
</html>
```
