<div class="plan-actions">

    {% if trial_eligible %}
    <div class="section-title">
    <div>
        <h2>پلن‌های اشتراک</h2>
        <span>پلن مناسب خودتان را انتخاب کنید و همین حالا شروع کنید</span>

        {% if not trial_eligible %}
        <p class="trial-used-note">
            شما قبلاً از فرصت تست رایگان استفاده کرده‌اید یا سفارشی ثبت کرده‌اید.
        </p>
        {% endif %}

    </div>
</div>

        <button
            class="secondary-button"
            onclick="startTrial({{ plan.id }})">

            تست رایگان {{ plan.trial_days }} روزه

        </button>

    {% else %}

        <button class="secondary-button" disabled title="تست رایگان فقط برای کاربران جدید است">
            تست رایگان استفاده شده
        </button>

    {% endif %}

    <button
        class="primary-button"
        onclick="selectPlanForPurchase({{ plan.id }}, '{{ plan.title }}', '{{ plan.price }}')">

        خرید اشتراک

    </button>

</div>
