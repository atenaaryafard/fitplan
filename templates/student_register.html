<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FIT PLAN | ورود یا ثبت‌نام</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    rgba(0, 255, 161, 0.10),
                    transparent 35%
                ),
                #080b12;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 430px;

            background: rgba(17, 22, 32, 0.96);

            border: 1px solid rgba(0, 255, 161, 0.20);

            border-radius: 22px;

            padding: 30px 25px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.45);
        }

        .logo {
            text-align: center;

            color: #00ffa1;

            font-size: 30px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 10px;
        }

        .title {
            text-align: center;

            font-size: 22px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #aab2c0;

            font-size: 14px;

            line-height: 1.8;

            margin-bottom: 25px;
        }

        .coach-box {
            background: rgba(0, 255, 161, 0.06);

            border: 1px solid rgba(0, 255, 161, 0.15);

            border-radius: 14px;

            padding: 14px;

            margin-bottom: 22px;

            text-align: center;
        }

        .coach-label {
            color: #8f98a8;

            font-size: 13px;

            margin-bottom: 5px;
        }

        .coach-name {
            color: #00ffa1;

            font-size: 18px;

            font-weight: bold;
        }

        .action-title {
            text-align: center;

            font-size: 15px;

            color: #dfe5ed;

            margin-bottom: 15px;
        }

        .action-button {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            min-height: 52px;

            border-radius: 13px;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 12px;

            transition: 0.2s;
        }

        .register-button {
            background: #00ffa1;

            color: #07110d;
        }

        .login-button {
            background: #111827;

            color: #ffffff;

            border: 1px solid #303746;
        }

        .action-button:hover {
            transform: translateY(-1px);
        }

        .register-button:hover {
            box-shadow:
                0 8px 25px rgba(0, 255, 161, 0.20);
        }

        .login-button:hover {
            border-color: #00ffa1;
            color: #00ffa1;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="logo">
            FIT PLAN
        </div>

        <div class="title">
            ورود به FIT PLAN
        </div>

        <div class="subtitle">
            برای استفاده از پنل شاگرد، یکی از گزینه‌های زیر را انتخاب کنید.
        </div>

        {% if coach %}
        <div class="coach-box">

            <div class="coach-label">
                مربی شما
            </div>

            <div class="coach-name">
                {{ coach["name"] }}
            </div>

        </div>
        {% endif %}

        <div class="action-title">
            اگر قبلاً حساب نساخته‌اید، ثبت‌نام کنید.
        </div>

        <a
            class="action-button register-button"
            href="{{ url_for('student_register_form', coach_code=coach['coach_code']) }}"
        >
            ثبت‌نام شاگرد
        </a>

        <a
            class="action-button login-button"
            href="{{ url_for('student_login', coach_code=coach['coach_code']) }}"
        >
            ورود به پنل
        </a>

    </div>

</body>

</html>
