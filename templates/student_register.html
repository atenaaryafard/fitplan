<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت‌نام شاگرد | FIT PLAN</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    rgba(0, 255, 161, 0.10),
                    transparent 35%
                ),
                #080b12;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 430px;

            background: rgba(17, 22, 32, 0.96);

            border: 1px solid rgba(0, 255, 161, 0.20);

            border-radius: 22px;

            padding: 30px 25px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.45);
        }

        .logo {
            text-align: center;

            color: #00ffa1;

            font-size: 30px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 10px;
        }

        .title {
            text-align: center;

            font-size: 22px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #aab2c0;

            font-size: 14px;

            line-height: 1.8;

            margin-bottom: 25px;
        }

        .coach-box {
            background: rgba(0, 255, 161, 0.06);

            border: 1px solid rgba(0, 255, 161, 0.15);

            border-radius: 14px;

            padding: 14px;

            margin-bottom: 20px;

            text-align: center;
        }

        .coach-label {
            color: #8f98a8;

            font-size: 13px;

            margin-bottom: 5px;
        }

        .coach-name {
            color: #00ffa1;

            font-size: 18px;

            font-weight: bold;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #dfe5ed;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border-radius: 12px;

            border: 1px solid #303746;

            background: #0d121b;

            color: #ffffff;

            font-size: 15px;

            outline: none;

            direction: rtl;
        }

        input:focus {
            border-color: #00ffa1;

            box-shadow:
                0 0 0 2px rgba(0, 255, 161, 0.08);
        }

        input::placeholder {
            color: #687180;
        }

        .error {
            background: rgba(255, 70, 70, 0.10);

            border: 1px solid rgba(255, 70, 70, 0.25);

            color: #ff8585;

            border-radius: 12px;

            padding: 12px;

            margin-bottom: 18px;

            font-size: 13px;

            line-height: 1.8;

            text-align: center;
        }

        button {
            width: 100%;

            border: none;

            border-radius: 13px;

            padding: 14px;

            background: #00ffa1;

            color: #07110d;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 25px rgba(0, 255, 161, 0.20);
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #929aaa;

            font-size: 13px;
        }

        .login-link a {
            color: #00ffa1;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="logo">
            FIT PLAN
        </div>

        <div class="title">
            ثبت‌نام شاگرد
        </div>

        <div class="subtitle">
            برای پیوستن به مربی و مشاهده برنامه‌های تمرینی خود ثبت‌نام کنید.
        </div>

        {% if coach %}
        <div class="coach-box">

            <div class="coach-label">
                شما در حال پیوستن به مربی
            </div>

            <div class="coach-name">
                {{ coach["name"] }}
            </div>

        </div>
        {% endif %}

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">

                <label for="name">
                    نام و نام خانوادگی
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="مثلاً آتنا آریافرد"
                    required
                >

            </div>

            <div class="form-group">

                <label for="phone">
                    شماره تماس
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="09123456789"
                    maxlength="11"
                    inputmode="numeric"
                    required
                >

            </div>

            <button type="submit">
                ثبت‌نام و ورود به پنل
            </button>

        </form>

    </div>

</body>

</html>
